name: MediCore Python Quality CI

on:
  push:
    branches:
      - main
      - simplify-clinical-lab-reports
  pull_request:
    branches:
      - main
      - 'feat/**'

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: pip
          cache-dependency-path: |
            app/backend/requirements.txt
            app/backend/requirements-voice.txt
      - name: Verify repository and service Python pins match
        run: diff ../../.python-version .python-version
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-voice.txt pytest
      - name: Run simplified backend tests
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_privacy_gateway.py \
            tests/test_privacy_canaries.py \
            tests/test_openai_case_document_service.py \
            tests/test_openai_lab_extraction_service.py \
            tests/test_openai_radiology_second_reader.py \
            tests/test_gemini_radiology_third_reader.py \
            tests/test_lab_30s_budget.py \
            tests/test_simple_case.py \
            tests/test_patient_clinical_vitals.py \
            tests/test_patient_protocol.py \
            tests/test_case_management.py \
            tests/test_consistency_section.py \
            tests/test_lab_consistency_rules.py \
            tests/test_report_consistency.py \
            tests/test_lab_cross_read.py \
            tests/test_clinical_voice.py \
            tests/test_voice_model_provisioning.py \
            tests/test_local_model_resources.py \
            tests/test_bounded_local_ocr.py \
            tests/test_radiology_report_parser.py \
            tests/test_patient_isolation.py \
            tests/test_patient_health_timeline.py \
            tests/test_patient_health_timeline_api.py \
            tests/test_report_type_inference.py \
            tests/test_lab_result_classification.py \
            tests/test_lab_document_semantic_dates.py \
            tests/test_document_dates.py \
            tests/test_simple_case_ai_vaka1.py \
            tests/test_vaka1_persistence_regression.py

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build frontend
        run: npm run build
