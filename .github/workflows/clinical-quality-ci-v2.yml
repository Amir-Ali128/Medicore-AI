name: MediCore Python Quality CI

on:
  push:
    branches:
      - main
      - simplify-clinical-lab-reports
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run simplified backend tests
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_simple_case.py \
            tests/test_patient_clinical_vitals.py \
            tests/test_patient_protocol.py \
            tests/test_radiology_report_parser.py \
            tests/test_patient_isolation.py \
            tests/test_patient_health_timeline.py \
            tests/test_patient_health_timeline_api.py \
            tests/test_report_type_inference.py

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build frontend
        run: npm run build
