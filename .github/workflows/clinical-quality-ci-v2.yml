name: Clinical Quality CI v2

on:
  push:
    branches:
      - fix/clinical-quality-layer
      - feature/clinical-domain-router
      - feature/single-source-evaluation
      - feature/radiology-clinical-observation-style
      - feature/native-vision-engine
      - feature/xray-core-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-quality-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run clinical quality tests
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_radiology_image_review.py \
            tests/test_source_only_case_evaluation.py \
            tests/test_clinical_domain_router_runtime.py \
            tests/test_clinical_quality_runtime.py \
            tests/test_clinical_quality_scope_runtime.py \
            tests/test_urinalysis_runtime.py \
            tests/test_native_vision_engine.py

  native-vision-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libopencv-dev pybind11-dev
      - name: Configure native vision engine
        run: cmake -S native/vision -B native/vision/build -DCMAKE_BUILD_TYPE=Release
      - name: Build native vision engine
        run: cmake --build native/vision/build --config Release --parallel 2
      - name: Run native X-Ray Core tests
        run: ctest --test-dir native/vision/build --output-on-failure

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build frontend
        run: npm run build
